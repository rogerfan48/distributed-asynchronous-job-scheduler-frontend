# SonarQube / SonarScanner configuration for the Job Scheduler frontend.
# Run a local SonarQube (e.g. Docker `sonarqube:community` on :9000), then:
#   pnpm test:coverage          # writes coverage/lcov.info
#   sonar-scanner               # uploads analysis + coverage to the server
# (Authenticate the scanner with SONAR_TOKEN / SONAR_HOST_URL env vars.)

sonar.projectKey=job-scheduler-frontend
sonar.projectName=Job Scheduler Frontend
sonar.sourceEncoding=UTF-8

# ── Sources vs. tests ────────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# ── Coverage (Vitest v8 → lcov) ──────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude from analysis: generated types, vendored shadcn/base-ui primitives,
# build output, and tooling. (Secrets/IPs never reach the repo — see .gitignore.)
sonar.exclusions=\
  src/types/**,\
  src/components/ui/**,\
  .next/**,\
  coverage/**,\
  node_modules/**,\
  **/*.config.*,\
  vitest/**

# Don't count un-unit-testable surfaces against coverage: generated code,
# vendored primitives, RSC pages/layouts/metadata images, and the tests themselves.
sonar.coverage.exclusions=\
  src/types/**,\
  src/components/ui/**,\
  src/app/**/layout.tsx,\
  src/app/**/page.tsx,\
  src/app/**/error.tsx,\
  src/app/{icon,apple-icon,opengraph-image,twitter-image}.tsx,\
  src/**/*.test.ts,\
  src/**/*.test.tsx,\
  vitest/**
