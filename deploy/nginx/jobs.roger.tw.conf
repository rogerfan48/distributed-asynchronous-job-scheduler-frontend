# Job Scheduler frontend — Nginx vhost for jobs.roger.tw
#
# Everything is proxied to the local Next.js container. The container's BFF
# reaches the backend over WireGuard itself, so there is deliberately NO
# `location /api/...` block pointing at the backend here.

server {
    server_name jobs.roger.tw;

    location / {
        proxy_pass http://127.0.0.1:2000;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "origin-when-cross-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # passing real IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
